<script>window.__WEB = true;</script>
<script>
// 英语练习 Safari 版（5.0）：把 Scriptable 的接口换成浏览器的。
// 页面和"脚本"跑在同一个网页里：脚本包在 window.__APP(...) 里，下面这些对象作为参数传进去。
// 数据：内存里一份 + IndexedDB 持久化（每次写入立即落盘）。API Key：localStorage，只在本机。
(function () {
  "use strict";
  const HOST = (window.__HOST = { wv: null, pending: false, fsError: "" });

  // 页面 rpc 发信号 → 叫脚本来取请求（脚本还没准备好就先记下）
  window.__TEST_SIGNAL = function () {
    if (HOST.wv && HOST.wv.shouldAllowRequest) HOST.wv.shouldAllowRequest({ url: "app://rpc/" + Date.now() });
    else HOST.pending = true;
  };

  // ---------------- base64 / utf8 ----------------
  function u8ToB64(u8) { let s = ""; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
  function b64ToU8(b64) { const s = atob(b64); const u8 = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return u8; }
  const utf8ToB64 = t => u8ToB64(new TextEncoder().encode(t));
  const b64ToUtf8 = b => new TextDecoder().decode(b64ToU8(b));

  class Data {
    constructor(b64) { this._b = b64 || ""; }
    static fromBase64String(s) { return new Data(s); }
    static fromString(s) { return new Data(utf8ToB64(s)); }
    toBase64String() { return this._b; }
    toRawString() { return b64ToUtf8(this._b); }
    getBytes() { return Array.from(b64ToU8(this._b)); }
  }

  // ---------------- 文件（内存 + IndexedDB） ----------------
  const DB_NAME = "english-coach", OS = "files";
  const files = new Map();          // path -> string | {__b64}
  const dirs = new Set(["/docs"]);
  let db = null;
  const inflight = new Set();
  let warned = false;

  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(OS);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("IndexedDB blocked"));
    });
  }
  async function loadFS() {
    db = await openDB();
    await new Promise((res, rej) => {
      const st = db.transaction(OS, "readonly").objectStore(OS);
      const kr = st.getAllKeys(), vr = st.getAll();
      vr.onsuccess = () => {
        const ks = kr.result || [], vs = vr.result || [];
        for (let i = 0; i < ks.length; i++) { const v = vs[i]; if (v && v.__dir) dirs.add(ks[i]); else files.set(ks[i], v); }
        res();
      };
      vr.onerror = () => rej(vr.error);
    });
  }
  function persist(fn) {
    if (!db) return Promise.resolve(false);
    const p = new Promise(res => {
      let tx;
      try { tx = db.transaction(OS, "readwrite"); fn(tx.objectStore(OS)); }
      catch (e) { console.error("IDB", e); res(false); return; }
      tx.oncomplete = () => res(true);
      tx.onerror = tx.onabort = () => {
        console.error("IDB write failed", tx.error);
        if (!warned) { warned = true; try { window.toast && toast("⚠️ 数据没能存进手机（存储空间满了，或开了无痕浏览）", 4000); } catch (e) {} }
        res(false);
      };
    });
    inflight.add(p); p.then(() => inflight.delete(p));
    return p;
  }
  const norm = p => String(p).replace(/\/+$/, "") || "/";
  const parent = p => { const i = p.lastIndexOf("/"); return i > 0 ? p.slice(0, i) : "/"; };
  function mkdirs(p) {
    const add = [];
    for (let d = norm(p); d && d !== "/" && !dirs.has(d); d = parent(d)) add.push(d);
    if (!add.length) return;
    add.forEach(d => dirs.add(d));
    persist(st => add.forEach(d => st.put({ __dir: 1 }, d)));
  }
  function put(p, v) { p = norm(p); mkdirs(parent(p)); files.set(p, v); persist(st => st.put(v, p)); }

  const fm = {
    documentsDirectory: () => "/docs",
    libraryDirectory: () => "/docs",
    temporaryDirectory: () => "/tmp",
    cacheDirectory: () => "/docs",
    joinPath: (a, b) => norm(a) + "/" + String(b).replace(/^\/+/, ""),
    fileExists: p => files.has(norm(p)) || dirs.has(norm(p)),
    isDirectory: p => dirs.has(norm(p)),
    createDirectory: p => mkdirs(p),
    readString: p => { const v = files.get(norm(p)); if (v == null) return null; return typeof v === "string" ? v : b64ToUtf8(v.__b64); },
    writeString: (p, s) => put(p, String(s)),
    read: p => { const v = files.get(norm(p)); if (v == null) return null; return typeof v === "string" ? Data.fromString(v) : new Data(v.__b64); },
    write: (p, d) => put(p, { __b64: d.toBase64String() }),
    remove: p => {
      p = norm(p);
      const keys = [];
      if (files.has(p)) keys.push(p);
      for (const k of files.keys()) if (k.startsWith(p + "/")) keys.push(k);
      for (const d of dirs) if (d === p || d.startsWith(p + "/")) keys.push(d);
      keys.forEach(k => { files.delete(k); dirs.delete(k); });
      if (keys.length) persist(st => keys.forEach(k => st.delete(k)));
    },
    copy: (a, b) => { const v = files.get(norm(a)); if (v == null) throw new Error("没有这个文件：" + a); put(b, v); },
    move: (a, b) => { fm.copy(a, b); fm.remove(a); },
    listContents: p => {
      p = norm(p); const pre = p + "/", out = new Set();
      for (const k of files.keys()) if (k.startsWith(pre)) out.add(k.slice(pre.length).split("/")[0]);
      for (const d of dirs) if (d.startsWith(pre)) out.add(d.slice(pre.length).split("/")[0]);
      return Array.from(out);
    },
    fileSize: p => { const v = files.get(norm(p)); if (v == null) return 0; return typeof v === "string" ? v.length / 1024 : v.__b64.length * 0.75 / 1024; },
    bookmarkExists: () => false,
    bookmarkedPath: () => null,
    isFileStoredIniCloud: () => false,
    isFileDownloaded: () => true,
    downloadFileFromiCloud: async () => {},
  };
  const FileManager = { local: () => fm, iCloud: () => fm };

  // ---------------- 钥匙串 → localStorage（只在这台手机） ----------------
  const KP = "kc:";
  const Keychain = {
    contains: k => localStorage.getItem(KP + k) != null,
    get: k => { const v = localStorage.getItem(KP + k); if (v == null) throw new Error("Keychain: 没有 " + k); return v; },
    set: (k, v) => localStorage.setItem(KP + k, String(v)),
    remove: k => localStorage.removeItem(KP + k),
  };
  // 录音测试页存过的 Key，直接拿来用
  try { if (!Keychain.contains("gemini_api_key") && /^AIza/.test(localStorage.getItem("gk") || "")) Keychain.set("gemini_api_key", localStorage.getItem("gk")); } catch (e) {}

  // ---------------- 新闻源：浏览器不能直接读 BBC/RNZ，改读仓库里定时抓好的 feeds.json ----------------
  const Feeds = {
    data: null, at: 0, loading: null,
    async load() {
      if (this.data && Date.now() - this.at < 20 * 60000) return this.data;
      if (!this.loading) this.loading = (async () => {
        try {
          const r = await fetch("feeds.json?t=" + Math.floor(Date.now() / 600000), { cache: "no-cache" });
          if (r.ok) { this.data = await r.json(); this.at = Date.now(); }
        } catch (e) { console.warn("feeds.json", e); }
        finally { this.loading = null; }
        return this.data;
      })();
      return this.loading;
    },
    xmlEsc: s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"),
    async get(url) {
      const d = await this.load(); if (!d) return null;
      const items = d.feeds && d.feeds[url];
      if (items) return "<rss><channel>" + items.map(i => `<item><title>${this.xmlEsc(i.title)}</title><link>${this.xmlEsc(i.link)}</link><description>${this.xmlEsc(i.desc)}</description></item>`).join("") + "</channel></rss>";
      const paras = d.articles && (d.articles[url] || d.articles[url.split("?")[0]]);
      if (paras) return "<html>" + paras.map(p => "<p>" + this.xmlEsc(p) + "</p>").join("") + "</html>";
      return null;
    },
  };

  // ---------------- 网络 ----------------
  class Request {
    constructor(url) { this.url = url; this.method = "GET"; this.headers = {}; this.body = null; this.timeoutInterval = 60; this.response = null; }
    async _text() {
      if (!/^https:\/\/generativelanguage\.googleapis\.com\//.test(this.url)) {
        const t = await Feeds.get(this.url);
        if (t != null) { this.response = { statusCode: 200, headers: {} }; return t; }
      }
      const ac = new AbortController();
      const tm = setTimeout(() => ac.abort(), (this.timeoutInterval || 60) * 1000);
      try {
        const r = await fetch(this.url, { method: this.method, headers: this.headers, body: this.method === "GET" ? undefined : this.body, signal: ac.signal });
        const h = {}; r.headers.forEach((v, k) => { h[k] = v; });
        this.response = { statusCode: r.status, headers: h };
        return await r.text();
      } finally { clearTimeout(tm); }
    }
    loadString() { return this._text(); }
    async loadJSON() { return JSON.parse(await this._text()); }
    async load() { return Data.fromString(await this._text()); }
  }

  // ---------------- 定时、朗读、打开网页 ----------------
  const Timer = {
    schedule: (ms, rep, cb) => { const h = rep ? setInterval(cb, ms) : setTimeout(cb, ms); return { invalidate() { clearInterval(h); clearTimeout(h); } }; },
  };
  const Speech = {
    speak: text => new Promise(res => {
      try {
        const u = new SpeechSynthesisUtterance(text); u.lang = "en-US";
        u.onend = u.onerror = () => res(); speechSynthesis.cancel(); speechSynthesis.speak(u);
        setTimeout(res, 2000 + String(text).length * 120);
      } catch (e) { res(); }
    }),
  };
  // 网页里没有苹果的听写面板；页面在 Safari 版里不会走到这里（输入方式只有按住说 / 键盘）
  const Dictation = { start: async () => { throw new Error("unsupported"); } };
  const Safari = { open: u => { window.open(u, "_blank", "noopener"); }, openInApp: async u => { window.open(u, "_blank", "noopener"); } };

  // ---------------- 导出文件：先弹一个"保存"按钮，点按钮时再调分享（Safari 要求分享必须由手指点击触发） ----------------
  const MIME = { json: "application/json", wav: "audio/wav", txt: "text/plain", m4a: "audio/mp4", mp3: "audio/mpeg" };
  function saveSheet(blob, name) {
    return new Promise((res, rej) => {
      const old = document.getElementById("__save"); if (old) old.remove();
      const d = document.createElement("div"); d.id = "__save";
      d.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center";
      const kb = Math.max(1, Math.round(blob.size / 1024));
      d.innerHTML = `<div style="background:var(--card,#fff);color:var(--ink,#222);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));font:16px/1.5 -apple-system,system-ui,sans-serif;box-shadow:0 -6px 24px rgba(0,0,0,.18)">
        <div style="font-weight:700;font-size:17px">文件准备好了</div>
        <div style="opacity:.7;font-size:14px;margin:4px 0 14px;word-break:break-all">${name.replace(/</g, "&lt;")}（${kb} KB）</div>
        <div style="opacity:.7;font-size:13px;margin-bottom:14px">点「保存」后在分享菜单里选 <b>存储到文件</b>。</div>
        <div style="display:flex;gap:10px"><button data-c style="flex:1;padding:13px;border-radius:14px;border:1px solid rgba(0,0,0,.12);background:transparent;color:inherit;font-size:16px">取消</button>
        <button data-s style="flex:2;padding:13px;border-radius:14px;border:0;background:var(--brand,#E6B422);color:var(--on-brand,#2E2300);font-weight:700;font-size:16px">保存</button></div></div>`;
      document.body.appendChild(d);
      const close = () => d.remove();
      d.querySelector("[data-c]").onclick = () => { close(); rej(new Error("cancel")); };
      d.querySelector("[data-s]").onclick = async () => {
        const file = new File([blob], name, { type: blob.type });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); close(); res([name]); return; }
        } catch (e) {
          if (e && e.name === "AbortError") return;   // 用户在分享菜单里取消了：留着这个面板，可以再点一次
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        close(); res([name]);
      };
    });
  }
  const DocumentPicker = {
    exportFile: async (path, name) => {
      const d = fm.read(path); if (!d) throw new Error("没有这个文件");
      name = name || String(path).split("/").pop();
      const ext = (name.split(".").pop() || "").toLowerCase();
      return saveSheet(new Blob([b64ToU8(d.toBase64String())], { type: MIME[ext] || "application/octet-stream" }), name);
    },
    exportString: async (str, name) => saveSheet(new Blob([str], { type: MIME[(String(name).split(".").pop() || "").toLowerCase()] || "text/plain" }), name || "export.txt"),
  };

  // ---------------- 其它 Scriptable 对象 ----------------
  class Alert {
    constructor() { this.title = ""; this.message = ""; this.acts = []; }
    addAction(a) { this.acts.push(a); } addCancelAction(a) { this.acts.push(a); } addDestructiveAction(a) { this.acts.push(a); }
    async present() { window.alert((this.title ? this.title + "\n\n" : "") + (this.message || "")); return 0; }
    presentAlert() { return this.present(); } presentSheet() { return this.present(); }
  }
  const Script = { name: () => "英语练习", complete: () => {}, setWidget: () => {} };
  const config = { runsInWidget: false, runsInApp: true, widgetFamily: null };
  const args = { queryParameters: Object.fromEntries(new URLSearchParams(location.search)) };
  class WebView {
    loadHTML() {
      HOST.wv = this;
      if (HOST.pending) { HOST.pending = false; setTimeout(() => window.__TEST_SIGNAL(), 0); }
      return Promise.resolve();
    }
    evaluateJavaScript(js) { try { return Promise.resolve((0, eval)(js)); } catch (e) { return Promise.reject(e); } }
    present() { return new Promise(() => {}); }
  }
  class CallbackURL { constructor(u) { this.u = u; this.p = {}; } addParameter(k, v) { this.p[k] = v; } async open() { throw new Error("unsupported"); } }
  class ListWidget {} const Font = {}; function Color() {} function LinearGradient() {}

  const __WEB__ = { flush: () => Promise.all(Array.from(inflight)), files, dirs };

  HOST.start = async function () {
    try { await loadFS(); }
    catch (e) { HOST.fsError = String(e && e.message || e); console.error("loadFS", e); }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    if (typeof window.__APP !== "function") throw new Error("app missing");
    return window.__APP(FileManager, Keychain, Request, Dictation, Speech, Timer, Safari, Script, config, args, WebView, CallbackURL, Data, DocumentPicker, Alert, ListWidget, Font, Color, LinearGradient, __WEB__);
  };
  // 后台/关掉前，等一下没写完的数据
  addEventListener("pagehide", () => { __WEB__.flush(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") __WEB__.flush(); });
  HOST.Feeds = Feeds;
})();

</script>

// ================= 朗读 =================
const TTS = {
  _shown: 0,
  init(){
    // iOS 网页里不能自动播放：第一次触摸时"解锁"朗读和播放器
    const unlock = () => {
      try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
      AI.unlock();
      document.removeEventListener("touchend", unlock); document.removeEventListener("click", unlock);
    };
    document.addEventListener("touchend", unlock); document.addEventListener("click", unlock);
  },
  indicator(on, label){
    let d = document.getElementById("speaking");
    if (!on) { if (d) d.remove(); return; }
    if (!d) { d = document.createElement("button"); d.id = "speaking"; d.className = "speaking"; document.body.appendChild(d); d.onclick = () => this.stop(); }
    const tip = this._shown++ < 2 && !label ? `<div class="small" style="opacity:.85">没声音？先关掉静音键</div>` : "";
    d.innerHTML = (label || "🔊 朗读中 · 点这里停止") + tip;
  },
  _sess: 0, _cur: 0,
  // 停止：作废当前所有播放（对话循环看到编号变了会立刻退出）
  stop(){ this._sess++; this._cur++; try { speechSynthesis.cancel(); } catch(e){} AI.stop(); this.indicator(false); },
  native(text){ this.indicator(true, "🔊 朗读中"); return rpc("speak", { text }).catch(() => {}).finally(() => this.indicator(false)); },
  // 短句：不指定具体声音，只设语言 → iOS 会用你在「阅读与朗读 › 声音」里为这个英文口音选的声音
  speak(text, opt){
    opt = opt || {}; text = String(text || "").replace(/["“”]/g, ""); if (!text.trim()) return Promise.resolve();
    if (S.settings.tts === "system" || typeof speechSynthesis === "undefined") return this.native(text);
    AI.stop();
    const me = ++this._cur;              // 这一句的编号；被更新的朗读顶掉后就不再处理
    const latest = () => me === this._cur;
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = S.settings.accent || "en";
      const base = +S.settings.rate || 0.95; u.rate = opt.slow ? Math.max(0.5, base * 0.72) : base;
      let done = false, started = false;
      const fin = () => { if (!done) { done = true; if (latest()) this.indicator(false); res(); } };
      u.onstart = () => { started = true; STT.dirty = false; }; u.onend = fin; u.onerror = fin;
      this.indicator(true);
      try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){ fin(); }
      // 2 秒没开口：只有它仍是最新的一句，才换系统朗读兜底（被顶掉的不兜底，避免多个声音同时出现）
      setTimeout(() => {
        if (done || started) return;
        if (!latest()) { fin(); return; }
        try { speechSynthesis.cancel(); } catch(e){}
        done = true; this.indicator(false); this.native(text).then(res);
      }, 2000);
      setTimeout(fin, Math.max(4000, text.length * 95 / u.rate));
    });
  },
  // 长内容：优先 AI 真人语音，失败退回系统声音
  async long(text, opt){
    opt = opt || {};
    if (S.settings.aiLong === true && S.hasKey) {
      try { return await AI.play({ text }, opt); }
      catch (e) { toast("AI 语音没成功，改用系统声音", 2500); }
    }
    return this.speak(text, opt);
  },
  async dialogue(lines, opt, onLine){
    const my = ++this._sess;             // 新的一轮开始，旧的一轮看到编号变了就退出
    const alive = () => my === this._sess;
    if (S.settings.aiLong === true && S.hasKey) {
      try {
        const text = lines.map(l => `${l.sp === "B" ? "B" : "A"}: ${l.en}`).join("\n");
        return await AI.play({ text, dialogue: true, a: "Kore", b: "Puck" }, Object.assign({}, opt, { lines, onLine }));
      } catch (e) { toast("AI 语音没成功，改用系统声音", 2500); }
    }
    for (let i = 0; i < lines.length; i++) {
      if (!alive()) return;
      onLine && onLine(i);
      await this.speak(lines[i].en, { slow: opt && opt.slow });
      if (!alive()) return;
      await new Promise(r => setTimeout(r, 250));
    }
    if (alive()) onLine && onLine(-1);
  },
};

// AI 语音播放器（同一个 audio 元素，第一次点击时解锁，之后可以异步播放）
const AI = {
  el: null, cache: {}, lastId: null,
  audio(){ if (!this.el) { this.el = new Audio(); this.el.preload = "auto"; this.el.setAttribute("playsinline", ""); } return this.el; },
  unlock(){ const a = this.audio(); if (this._unlocked) return; this._unlocked = true; try { a.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA"; const p = a.play(); if (p && p.then) p.then(() => a.pause()).catch(() => {}); } catch(e){} },
  stop(){ if (this.el) { try { this.el.pause(); } catch(e){} } if (this._end) this._end(); },
  async get(req){
    TTS.indicator(true, "🎙️ 正在生成 AI 语音…（第一次要等一会儿）");
    try {
      const r = await rpc("tts", req);
      if (!this.cache[r.id]) {
        let b = ""; for (let i = 0; i < r.parts; i++) b += await rpc("audioPart", { id: r.id, i });
        const bin = atob(b), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        this.cache[r.id] = URL.createObjectURL(new Blob([u8], { type: "audio/wav" }));
      }
      this.lastId = r.id;
      return r.id;
    } finally { TTS.indicator(false); }
  },
  async play(req, opt){
    opt = opt || {}; this.unlock();
    try { speechSynthesis.cancel(); } catch(e){}
    const id = await this.get(req);
    const a = this.audio();
    if (this._end) this._end();
    a.src = this.cache[id];
    a.playbackRate = opt.slow ? 0.75 : 1; try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
    TTS.indicator(true, "🔊 AI 语音播放中 · 点这里停止");
    // 按文字长度估算当前读到哪一行（用于对话高亮）
    let starts = null;
    if (opt.lines && opt.onLine) { const lens = opt.lines.map(l => l.en.length + 8); const tot = lens.reduce((x, y) => x + y, 0); let acc = 0; starts = lens.map(l => { const s = acc / tot; acc += l; return s; }); }
    const tick = () => { if (!starts || !a.duration) return; const f = a.currentTime / a.duration; let k = 0; for (let i = 0; i < starts.length; i++) if (f >= starts[i]) k = i; opt.onLine(k); };
    a.ontimeupdate = tick;
    await new Promise((res, rej) => {
      this._end = () => { this._end = null; a.onended = null; a.onerror = null; res(); };
      a.onended = () => this._end && this._end();
      a.onerror = () => { this._end = null; rej(new Error("播放失败")); };
      const p = a.play(); if (p && p.catch) p.catch(e => { this._end = null; rej(e); });
    });
    TTS.indicator(false); opt.onLine && opt.onLine(-1);
    return id;
  },
  async save(req, name){
    try {
      const id = await this.get(req);
      await rpc("exportAudio", { id, name });
      toast("已保存。用「文件」或 VLC 打开就能熄屏听", 3500);
    } catch (e) { if (!/cancel/i.test(e.message)) toast("没保存成功：" + e.message, 3500); }
  },
};

function dueCards(){ const now = Date.now(); return S.deck.filter(c => c.p && c.p.due <= now).sort((a,b) => a.p.due - b.p.due); }
function newLeft(){ return Math.max(0, (S.settings.newPerDay || 10) - (S.meta.newToday || 0)); }

function sparkline(vals){
  if (vals.length < 2) return "";
  const w = 300, h = 46, max = Math.max(...vals) * 1.1, min = Math.min(...vals) * 0.9;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (v - min) / (max - min || 1) * h).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function highlight(text, terms, cls){
  const list = [];
  (terms || []).forEach(t => String(t).split(/\s*\/\s*/).forEach(x => { x = x.trim(); if (x.length > 1 && x.length <= 40 && !/\.\.\./.test(x)) list.push(x); }));
  if (!list.length) return esc(text);
  list.sort((a,b) => b.length - a.length);
  const alt = list.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp("(^|[^A-Za-z])(" + alt + ")(?![A-Za-z])", "gi");
  return esc(text).replace(re, (m, a, b) => `${a}<span class="${cls}" data-term="${b}">${b}</span>`);
}
// 从一段话里取出包含某个词的那一句（新闻正文是一整段，不能整段当例句）
function sentenceOf(text, word) {
  const t = String(text || "").replace(/\s+/g, " ").trim();
  if (t.split(" ").length <= 30) return t;
  const parts = t.match(/[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g) || [t];
  const w = String(word || "").toLowerCase().replace(/[^a-z0-9' -]/g, "").trim();
  const hit = w && parts.find(s => s.toLowerCase().includes(w)) || parts[0];
  const ws = hit.trim().split(" ");
  return ws.length > 30 ? ws.slice(0, 30).join(" ") + "…" : hit.trim();
}
function whyHtml(x){ const w = x && (x.why || x.why_zh); return w ? `<div class="why">💡 ${esc(w)}</div>` : ""; }

  if (!v) return;
  const d = pop(`<div class="row"><div class="grow"><div class="title">${esc(v.term)}</div><div>${esc(v.zh)}</div></div><button class="ib" data-s>🔊</button></div><div class="muted" style="margin-top:8px"><i>${esc(v.ex || "")}</i></div>${whyHtml(v)}`);
  $("[data-s]", d).onclick = () => TTS.speak(v.term + ". " + (v.ex || ""));
  TTS.speak(v.term);
}

// ---------- 一节课：练习 → 听 → 读+跟读 → 对话 → 完成 ----------
const STEP_EN = { "练习": "Quiz", "听": "Listen", "读+跟读": "Read", "读": "Read", "对话": "Talk", "完成": "Done", "语法": "Grammar", "讨论": "Discuss" };
function stepsBar(names, cur, done){ return `<div class="steps">${names.map((n, i) => `<div class="${i === cur ? "on" : ""} ${done[i] ? "done" : ""}"><i></i>${STEP_EN[n] ? L(STEP_EN[n], n) : n}</div>`).join("")}</div>`; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function distractors(pool, right, n){ const r = String(right).toLowerCase(); return shuffle([...new Set(pool.filter(x => x && String(x).toLowerCase() !== r))]).slice(0, n); }

// 用课程内容在本机出题（不额外调用 Gemini）
function buildQuiz(L){
  const vocab = (L.vocab || []).filter(v => v.term && v.zh);
  const zhPool = vocab.map(v => v.zh).concat(S.deck.map(c => c.zh));
  const enPool = vocab.map(v => v.term).concat(S.deck.map(c => c.term).filter(t => t.length < 30));
  const items = [];
  vocab.forEach(v => items.push({ type: "en2zh", term: v.term, ex: v.ex, ans: v.zh, opts: shuffle([v.zh, ...distractors(zhPool, v.zh, 3)]) }));
  vocab.slice(0, 3).forEach(v => items.push({ type: "listen", term: v.term, ans: v.term, opts: shuffle([v.term, ...distractors(enPool, v.term, 3)]) }));
  const lines = L.dialogue.filter(d => d.sp === "B" && d.zh && words(d.en).length >= 3 && words(d.en).length <= 10);
  shuffle(lines).slice(0, 2).forEach(d => {
    const toks = d.en.replace(/[.!?,]+$/g, "").split(/\s+/);
    const extra = distractors(vocab.map(v => v.term.split(" ")[0]).concat(["the", "is", "do", "it"]), "", 2).filter(x => !toks.includes(x)).slice(0, 2);
    items.push({ type: "build", zh: d.zh, en: d.en, toks, tiles: shuffle(toks.concat(extra)) });
  });
  // 先认词，再听音，最后拼句子
  return items;
}

// 小题引擎：一题一屏，答错的放到最后再来一次
// saved：上次做到哪（题目序号队列）；onProgress：每答一题回调一次，用来存进度
function Quiz(box, items, onDone, saved, onProgress){
  let queue = items.map((_, i) => i), total = items.length, done = 0, wrong = 0, again = new Set();
  if (saved && Array.isArray(saved.queue)) { queue = saved.queue.filter(i => items[i]); total = saved.total || total; done = saved.done || 0; wrong = saved.wrong || 0; again = new Set(saved.again || []); }
  const next = () => {
    if (!queue.length) return onDone({ total: items.length, wrong: again.size });
    const qi = queue[0], it = items[qi];
    let h = `<div class="row" style="margin:14px 2px"><div class="bar grow"><i style="width:${Math.round(done / total * 100)}%"></i></div><span class="muted small">${done}/${total}</span></div><div class="card qz">`;
    if (it.type === "en2zh") h += `<div class="muted small">这个词是什么意思？</div><div class="row" style="margin:10px 0 16px"><div class="big grow">${esc(it.term)}</div><button class="ib" data-say>🔊</button></div>`;
    if (it.type === "listen") h += `<div class="muted small">听一听，选出你听到的词</div><div style="text-align:center;margin:16px 0"><button class="btn" data-say style="min-width:150px">🔊 再听一遍</button></div>`;
    if (it.type === "build") h += `<div class="muted small">用下面的词拼出这句话</div><div class="title" style="margin:8px 0 12px">${esc(it.zh)}</div><div class="slots" id="slots"></div><div class="tiles" id="tiles">${it.tiles.map((t, i) => `<button class="tile2" data-t="${i}">${esc(t)}</button>`).join("")}</div>`;
    if (it.type !== "build") h += `<div class="opts">${it.opts.map((o, i) => `<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>`;
    else h += `<div class="btns"><button class="btn plain" id="clr">清空</button><button class="btn" id="chk">检查</button></div>`;
    h += `</div>`;
    box.innerHTML = h;
    const say = $("[data-say]", box); if (say) say.onclick = () => TTS.speak(it.term);
    if (it.type === "listen" || it.type === "en2zh") TTS.speak(it.term);
    const result = (ok, right) => {
      if (!ok) { wrong++; if (!again.has(qi)) { again.add(qi); queue.push(qi); total++; } }
      queue.shift(); done++;
      onProgress && onProgress({ queue: queue.slice(), total, done, wrong, again: Array.from(again) });
      const sheet = document.createElement("div"); sheet.className = "sheet " + (ok ? "good" : "bad");
      sheet.innerHTML = `<div class="title">${ok ? "✓ 答对了！" : "✗ 正确答案"}</div>${ok ? "" : `<div style="margin-top:4px;font-size:18px">${esc(right)}</div>`}${it.ex && it.type === "en2zh" ? `<div class="small" style="margin-top:6px;opacity:.85"><i>${esc(it.ex)}</i></div>` : ""}<button class="btn block" style="margin-top:12px">继续</button>`;
      document.body.appendChild(sheet);
      if (it.type === "build") TTS.speak(it.en);
      $("button", sheet).onclick = () => { sheet.remove(); next(); };
    };
    $$(".opt", box).forEach(b => b.onclick = () => {
      const pick = it.opts[+b.dataset.o], ok = pick === it.ans;
      $$(".opt", box).forEach(x => { x.disabled = true; if (it.opts[+x.dataset.o] === it.ans) x.classList.add("right"); });
      if (!ok) b.classList.add("wrongo");
      result(ok, it.type === "en2zh" ? `${it.term} = ${it.ans}` : it.ans);
    });
    if (it.type === "build") {
      const picked = [];
      const redraw = () => {
        $("#slots", box).innerHTML = picked.map((i, k) => `<button class="tile2 in" data-k="${k}">${esc(it.tiles[i])}</button>`).join("") || `<span class="muted small">点下面的词</span>`;
        $$("#tiles .tile2", box).forEach(b => b.classList.toggle("used", picked.includes(+b.dataset.t)));
        $$("#slots .tile2", box).forEach(b => b.onclick = () => { picked.splice(+b.dataset.k, 1); redraw(); });
      };
      $$("#tiles .tile2", box).forEach(b => b.onclick = () => { const i = +b.dataset.t; if (!picked.includes(i)) { picked.push(i); TTS.speak(it.tiles[i]); redraw(); } });
      $("#clr", box).onclick = () => { picked.length = 0; redraw(); };
      $("#chk", box).onclick = () => { const said = picked.map(i => it.tiles[i]).join(" "); result(words(said).join(" ") === words(it.en).join(" "), it.en); };
      redraw();
    }
  };
  next();
}

VIEWS.lesson = async (v, p) => {
  setHeader(p.unit.title_zh, `<button class="hbtn" id="regen">换内容</button>`);
  let L;
  try { L = await busy("正在准备这一课（约 20 秒）…", () => rpc("lesson", { trackId: p.trackId, li: p.li, ui: p.ui })); }
  catch (e) { if (!e.handled) back(); return; }
  const key = `c:${S.settings.region || "NZ"}:${p.trackId}:${p.li}:${p.ui}`;
  $("#regen").onclick = async () => { try { await busy("重新生成这一课…", () => rpc("lesson", { trackId: p.trackId, li: p.li, ui: p.ui, force: true })); rpc("clearSaved", { key }); p.st = null; p.resumed = false; render(); } catch(e){} };
  setGloss(L.gloss);
  // 关掉 APP 前学到第几步：从文件里取回来接着学
  if (!p.st) { const sv = await rpc("getSaved", { key }).catch(() => null); if (sv && sv.st && (sv.st.step > 0 || sv.st.qState)) { p.st = sv.st; p.resumed = true; } }
  const st = p.st = p.st || { step: 0, done: {}, best: {}, chat: null, quiz: null, ans: {}, noSpeak: false };
  const nav = { view: "lesson", params: { trackId: p.trackId, li: p.li, ui: p.ui, unit: p.unit, levelName: p.levelName } };
  const save = () => { const o = Object.assign({}, st); if (o.step < 4) o.chat = null; rpc("saveStep", { key, st: o, nav, title: p.unit.title_zh, steps: 5 }).catch(() => {}); };
  const resumeBar = () => p.resumed ? `<div class="row card" style="padding:10px 12px;margin-top:10px"><div class="grow small">↩︎ 已接着上次的进度（第 ${st.step + 1} 步）</div><button class="chip" id="restart">从头开始</button></div>` : "";
  const names = ["练习", "听", "读+跟读", "对话", "完成"];
  const terms = (L.vocab || []).map(x => x.term);
  const quizQ = (L.quiz || []).filter(q => q && q.options && q.options.length >= 2);
  const trackName = (S.tracks.find(t => t.id === p.trackId) || {}).name || "";
  const draw = () => {
    let h = stepsBar(names, st.step, st.done) + resumeBar();
    if (st.step < 4) save();
    if (st.step === 0) {
      const items = st.qItems || (st.qItems = buildQuiz(L));
      if (!items.length) { st.done[0] = true; st.step = 1; return draw(); }
      v.innerHTML = h + `<div class="muted" style="margin:10px 4px 0">${esc(L.intro_zh)}</div><div id="qz"></div>`;
      bindRestart();
      Quiz($("#qz", v), items, r => { st.quiz = r; st.qState = null; st.done[0] = true; st.step = 1; draw(); }, st.qState, qs => { st.qState = qs; save(); });
      return;
    }
    if (st.step === 1) {
      h += `<div class="card"><div class="title">先别看文字，听一遍对话</div><div class="muted small">A：${esc(L.a_name)}　B：${esc(L.b_name)}（就是你）</div><div class="btns"><button class="btn" id="play">▶︎ 播放对话</button><button class="btn ghost" id="slow">🐢 慢速</button></div><button class="btn plain block" id="aud" style="margin-top:10px">🎧 存成音频（熄屏、后台也能听）</button></div>`;
      if (quizQ.length) {
        h += `<div class="card"><div class="title" style="margin-bottom:4px">听完回答</div>`;
        quizQ.forEach((q, qi) => {
          const a = st.ans[qi];
          h += `<div style="margin-top:12px"><div style="font-weight:600">${esc(q.q)}</div><div class="muted small">${esc(q.q_zh || "")}</div><div class="opts" style="margin-top:8px">${q.options.map((o, oi) => `<button class="opt ${a != null ? (oi === q.answer ? "right" : (oi === a ? "wrongo" : "")) : ""}" data-q="${qi}" data-o="${oi}" ${a != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>${a != null ? `<div class="small" style="margin-top:6px">${a === q.answer ? "✓ " : "✗ "}${esc(q.explain_zh || "")}</div>` : ""}</div>`;
        });
        h += `</div>`;
      }
      h += `<div class="card blur hidezh" id="dlg">${L.dialogue.map((d, i) => `<div class="line" data-i="${i}"><div class="who ${d.sp}">${d.sp}</div><div class="grow"><div class="en">${wordify(esc(d.en))}</div><div class="zh">${esc(d.zh)}</div></div></div>`).join("")}</div>`;
      h += `<div class="btns"><button class="btn plain" id="reveal">看文字</button><button class="btn" id="next">下一步 ›</button></div>`;
    } else if (st.step === 2) {
      h += `<div class="card" id="dlg"><div class="row" style="margin-bottom:6px"><div class="title grow">读对话</div><button class="chip" id="zh">中文</button><button class="chip" id="play">▶︎</button></div>${L.dialogue.map((d, i) => `<div class="line" data-i="${i}"><div class="who ${d.sp}">${d.sp}</div><div class="grow"><div class="en">${wordify(highlight(d.en, terms, "vw"))}</div><div class="zh">${esc(d.zh)}</div></div><button class="ib" data-say="${i}">🔊</button></div>`).join("")}<div class="muted small" style="margin-top:8px">黄色是本课生词；其他不认识的词也可以直接点</div></div>`;
      if (!st.noSpeak) h += `<div class="card"><div class="row"><div class="title grow">跟读你要说的句子</div><button class="chip" id="mute">🙊 现在不方便说话</button></div><div class="muted small">点 🎤 读出来，按匹配度打分；可以反复读，取最高分。不会读的词直接点它，🐢 是整句慢速</div>${L.shadow.map((s, i) => `<div class="shadow"><div style="display:flex;flex-direction:column;gap:2px"><button class="ib" data-sh-say="${i}">🔊</button><button class="ib" data-sh-slow="${i}" title="慢速">🐢</button></div><div class="grow en" style="font-size:17px">${wordify(esc(s))}</div><span class="score ${st.best[i] != null ? scoreClass(st.best[i]) : ""}" id="sc${i}">${st.best[i] != null ? st.best[i] + "%" : ""}</span><button class="btn ghost" style="min-height:40px;padding:8px 12px" data-sh="${i}">🎤</button></div>`).join("")}</div>`;
      else h += `<div class="card"><div class="row"><div class="grow muted">🙊 已跳过跟读。方便的时候可以回来补。</div><button class="chip" id="unmute">恢复跟读</button></div></div>`;
      h += `<div class="card"><div class="title" style="margin-bottom:6px">本课生词（完成后自动加入单词本）</div>${(L.vocab || []).map(x => `<div class="shadow"><button class="ib" data-v="${esc(x.term)}">🔊</button><div class="grow"><b>${esc(x.term)}</b> · ${esc(x.zh)}<div class="muted small"><i>${esc(x.ex)}</i></div>${whyHtml(x)}</div></div>`).join("") || `<div class="muted">这课的词你都学过了 👍</div>`}</div>`;
      h += `<div class="btns"><button class="btn" id="next">去对话 ›</button></div>`;
    } else if (st.step === 3) {
      return startChat();
    } else {
      const shadowVals = Object.values(st.best), shadowAvg = shadowVals.length ? Math.round(shadowVals.reduce((x,y) => x + y, 0) / shadowVals.length) : null;
      const turns = st.chat ? st.chat.turns : 0;
      const pass = turns >= 3;
      st.result = { turns, shadow: shadowAvg, avgWords: st.chat ? st.chat.avgWords : 0, quizWrong: st.quiz ? st.quiz.wrong : 0 };
      h += `<div class="card" style="text-align:center"><div style="font-size:46px">${pass ? "🎉" : "💪"}</div><div class="big">${pass ? "过关！+15 经验" : "再说几句就过关"}</div><div class="grid3" style="margin-top:14px"><div class="stat"><b class="${turns >= 3 ? "s-good" : "s-low"}">${turns}</b><span>对话句数（≥3）</span></div><div class="stat"><b>${shadowAvg != null ? shadowAvg + "%" : "–"}</b><span>跟读均分</span></div><div class="stat"><b>${st.quiz ? st.quiz.total - st.quiz.wrong + "/" + st.quiz.total : "–"}</b><span>练习一次答对</span></div></div>${!pass ? `<div class="muted small" style="margin-top:8px">不会说可以点对话里的建议回答</div>` : ""}</div>`;
      if (st.chat && st.chat.summary) h += st.chat.summary;
      h += pass ? `<div class="btns"><button class="btn plain" id="map">回到地图</button><button class="btn ok" id="nextUnit">下一课 ›</button></div>`
                : `<div class="btns"><button class="btn" id="toChat">再对话一次</button></div>`;
      if (!pass) save();
      if (pass && !st.saved) {
        st.saved = true; rpc("clearSaved", { key });
        rpc("completeUnit", { trackId: p.trackId, li: p.li, ui: p.ui, result: st.result }).then(refresh);
        const items = (L.vocab || []).map(x => Object.assign({ note: "课程：" + p.unit.title_zh }, x));
        rpc("addCards", { items, cat: "课程·" + trackName }).then(n => n && toast(`已加入单词本「课程·${trackName}」：${n} 个`));
      }
    }
    v.innerHTML = h;
    bind();
  };
  const bindRestart = () => { const rs = $("#restart", v); if (rs) rs.onclick = () => { rpc("clearSaved", { key }); p.st = null; p.resumed = false; render(); }; };
  const bind = () => {
    bindRestart();
    const dl = $("#dlg", v);
    const hl = i => $$(".line", v).forEach(x => x.classList.toggle("playing", +x.dataset.i === i));
    const play = $("#play", v); if (play) play.onclick = () => { AI.unlock(); TTS.dialogue(L.dialogue, {}, hl); };
    const slow = $("#slow", v); if (slow) slow.onclick = () => { AI.unlock(); TTS.dialogue(L.dialogue, { slow: true }, hl); };
    const au = $("#aud", v); if (au) au.onclick = () => { AI.unlock(); AI.save(audioReqLesson(L), "英语-" + p.unit.title_en); };
    const rv = $("#reveal", v); if (rv) rv.onclick = () => { dl.classList.toggle("blur"); rv.textContent = dl.classList.contains("blur") ? "看文字" : "隐藏文字"; };
    const zh = $("#zh", v); if (zh) { dl.classList.add("hidezh"); zh.onclick = () => { dl.classList.toggle("hidezh"); zh.classList.toggle("on"); }; }
    $$("[data-q]", v).forEach(b => b.onclick = () => { st.ans[+b.dataset.q] = +b.dataset.o; draw(); });
    $$("[data-say]", v).forEach(b => b.onclick = () => { const d = L.dialogue[+b.dataset.say]; TTS.speak(d.en); });
    $$(".vw", v).forEach(s => s.onclick = () => vocabPopup(s.dataset.term, L.vocab));
    $$("[data-v]", v).forEach(b => b.onclick = () => { const x = L.vocab.find(y => y.term === b.dataset.v); TTS.speak(x.term + ". " + x.ex); });
    $$("[data-sh-say]", v).forEach(b => b.onclick = () => TTS.speak(L.shadow[+b.dataset.shSay]));
    $$("[data-sh-slow]", v).forEach(b => b.onclick = () => TTS.speak(L.shadow[+b.dataset.shSlow], { slow: true }));
    $$(".shadow", v).forEach((row, i) => markMissed(row, (st.miss || {})[i]));
    const mu = $("#mute", v); if (mu) mu.onclick = () => { st.noSpeak = true; draw(); };
    const um = $("#unmute", v); if (um) um.onclick = () => { st.noSpeak = false; draw(); };
    $$("[data-sh]", v).forEach(b => b.onclick = async () => {
      const i = +b.dataset.sh;
      const said = await readAloud(L.shadow[i]); if (!said) return;
      const r = shadowScore(L.shadow[i], said);
      st.best[i] = Math.max(st.best[i] || 0, r.score); st.miss = st.miss || {}; st.miss[i] = r.missed; save();
      const el = $("#sc" + i, v); el.textContent = r.score + "%"; el.className = "score " + scoreClass(r.score);
      markMissed($$(".shadow", v)[i], r.missed);
      pop(`<div class="title ${scoreClass(r.score)}">${r.score >= 85 ? "🌟" : r.score >= 65 ? "👍" : "💪"} ${r.score}%</div><div class="muted small" style="margin-top:6px">识别到：${esc(said)}</div>${r.missed.length ? `<div style="margin-top:6px">没对上：<b>${esc(r.missed.join(", "))}</b></div><div class="muted small">已在句子里用底纹标出，点那个词可以单独听</div>` : `<div style="margin-top:6px">全部对上 👍</div>`}`);
    });
    const nx = $("#next", v); if (nx) nx.onclick = () => { TTS.stop(); st.done[st.step] = true; st.step++; draw(); };
    const m = $("#map", v); if (m) m.onclick = () => back();
    const nu = $("#nextUnit", v); if (nu) nu.onclick = () => goNextUnit(p.trackId, true);
    const tc = $("#toChat", v); if (tc) tc.onclick = () => { st.step = 3; draw(); };
  };
  const startChat = () => {
    save();
    v.innerHTML = stepsBar(names, 3, st.done) + resumeBar() + `<div id="chatbox"></div>`; bindRestart();
    Chat($("#chatbox", v), {
      scene: { role: L.rp_role, setting: L.rp_setting, level: p.levelName + "（" + p.unit.title_en + "）", student: (() => { const tk = S.tracks.find(x => x.id === p.trackId) || {}; return tk.kind === "student" || tk.group === "学生"; })() },
      opener: L.rp_opener, openerSuggest: L.rp_suggest, minTurns: 3, kind: "course:" + p.trackId,
      onEnd: (res) => { st.chat = res; st.done[3] = true; st.step = 4; draw(); },
    });
  };
  draw();
};

// 打开某门课的下一节未完成的课
async function goNextUnit(trackId, replace){
  const c = await rpc("course", { trackId });
  if (!c) { go("track", { id: trackId }, replace); return; }
  const start = (S.settings.startLevel || 1) - 1;
  let found = null;
  c.levels.forEach((l, li) => l.units.forEach((u, ui) => { if (!found && li >= start && !c.done[`${li}-${ui}`]) found = { li, ui }; }));
  if (!found) { toast("这门课都完成了 🎓"); go("track", { id: trackId }, replace); return; }
  go("lesson", { trackId, li: found.li, ui: found.ui, unit: c.levels[found.li].units[found.ui], levelName: c.levels[found.li].name_zh }, replace);
}

// ---------- 对话组件 ----------
function Chat(box, o){
  const hist = [];      // {r:"p"|"u", t}
  const said = [], corrections = [];
  let turns = 0, wordsN = 0, retries = 0, mode = S.settings.mode || "brave", waiting = false;
  box.innerHTML = `<div class="row" style="margin:10px 0"><div class="muted small grow">${o.minTurns ? `至少说 ${o.minTurns} 句` : ""} <span id="cnt"></span></div><div class="seg" id="mode"><button data-m="brave">🗣 敢说</button><button data-m="drill">🎯 精练</button></div></div><div class="chat" id="msgs"></div>
  <div class="dock"><div class="wrap"><button class="mic" id="mic">🎤 点一下，开始说</button><div class="typebox" id="tb" hidden><input id="ti" placeholder="用英文打字回答" autocomplete="off"><button class="btn" id="ts">发送</button></div><div class="subbar"><button id="type">⌨️ 打字</button><button id="hint">💡 不会说</button><button id="slow">🐢 再听</button><button id="end">⏹ 结束</button></div></div></div>`;
  const msgs = $("#msgs", box);
  const setMode = m => { mode = m; $$("#mode button", box).forEach(b => b.classList.toggle("on", b.dataset.m === m)); $$(".fb", box).forEach(f => f.classList.toggle("collapsed", m === "brave")); rpc("saveSettings", { mode: m }); S.settings.mode = m; };
  $$("#mode button", box).forEach(b => b.onclick = () => setMode(b.dataset.m));
  setMode(mode);
  const scroll = () => setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 30);
  const cnt = () => { $("#cnt", box).textContent = `· 已说 ${turns} 句`; };
  const add = (cls, html) => { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; msgs.appendChild(d); scroll(); return d; };
  const lastPartner = () => { for (let i = hist.length - 1; i >= 0; i--) if (hist[i].r === "p") return hist[i].t; return ""; };
  function partner(text, zh, sugg){
    hist.push({ r: "p", t: text });
    $$(".sugg", box).forEach(x => x.remove());
    const d = add("them", `<div class="bub"><div class="en">${wordify(esc(text))}</div><div class="zh" hidden>${esc(zh || "")}</div><div class="tools"><button data-a="say">🔊</button><button data-a="slow">🐢</button><button data-a="zh">中文</button></div></div>`);
    $("[data-a=say]", d).onclick = () => TTS.speak(text);
    $("[data-a=slow]", d).onclick = () => TTS.speak(text, { slow: true });
    if (sugg && sugg.length) {
      const sg = document.createElement("div"); sg.className = "sugg";
      sg.innerHTML = `<div class="muted small">💬 不会说？参考下面的说法：点一句 → 先听 → 看着读出来</div>` + sugg.slice(0, 3).map((x, i) => `<button data-s="${i}"><span class="ib" style="padding:0 6px 0 0">🔊</span>${esc(x)}</button>`).join("");
      msgs.appendChild(sg);
      $$("button", sg).forEach(b => b.onclick = async () => {
        const t = sugg[+b.dataset.s];
        await TTS.speak(t);
        const said = await readAloud(t);          // 必须自己读出来
        if (!said) return;                         // 取消就留在原处，可以换一句或自己说
        sg.remove();
        send(said, { target: t, score: shadowScore(t, said) });
      });
      scroll();
    }
    $("[data-a=zh]", d).onclick = async () => { const z = $(".zh", d); if (!z.textContent) { z.textContent = "翻译中…"; z.hidden = false; try { z.textContent = await rpc("translate", { text }); } catch(e){ z.textContent = "翻译失败"; } } else z.hidden = !z.hidden; };
    TTS.speak(text);
  }
  function feedback(fb, userText){
    const n = (fb.corrections || []).length;
    const better = fb.better_version && words(fb.better_version).join(" ") !== words(userText).join(" ");
    const f = document.createElement("div");
    f.className = "fb" + (n || better ? " has" : "") + (mode === "brave" ? " collapsed" : "");
    f.innerHTML = `<div class="sum">${fb.meaning_ok ? "✓ 意思表达到了" : "⚠️ 对方可能没完全听懂"}<span class="muted small" style="margin-left:auto">${n ? n + " 处可改 " : better ? "有更地道的说法 " : "很好 "}${mode === "brave" ? "▸" : ""}</span></div>
      <div class="det">${fb.praise_zh ? `<div>👍 ${esc(fb.praise_zh)}</div>` : ""}${(fb.corrections || []).map(c => `<div class="corr"><div class="x">${esc(c.you_said)}</div><div class="v">${esc(c.better)}</div><div class="muted small">${esc(c.why_zh)}</div></div>`).join("")}${(fb.pron_suspects || []).length ? `<div class="small" style="margin-top:6px">🔈 可能发音不清：<b>${esc(fb.pron_suspects.join(", "))}</b></div>` : ""}${better ? `<div class="better"><div class="small muted">更地道的说法</div><div class="en" style="font-size:17px">${esc(fb.better_version)}</div><div class="btns" style="margin-top:8px"><button class="btn ghost" style="min-height:40px" data-a="say">🔊 听</button><button class="btn" style="min-height:40px" data-a="re">🔁 照着说</button></div><div class="small" data-a="res"></div></div>` : ""}</div>`;
    msgs.appendChild(f);
    $(".sum", f).onclick = () => f.classList.toggle("collapsed");
    const s = $("[data-a=say]", f); if (s) s.onclick = () => TTS.speak(fb.better_version, { slow: true });
    const r = $("[data-a=re]", f); if (r) r.onclick = async () => {
      const t = await readAloud(fb.better_version); if (!t) return; retries++;
      const sc = shadowScore(fb.better_version, t);
      $("[data-a=res]", f).innerHTML = `<span class="${scoreClass(sc.score)}"><b>${sc.score}%</b></span> · 识别到：${esc(t)}${sc.missed.length ? `<br>没对上：<b>${esc(sc.missed.join(", "))}</b>` : " 👍"}`;
    };
    scroll();
  }
  async function send(text, ref){
    text = (text || "").trim(); if (!text || waiting) return;
    waiting = true; $("#mic", box).disabled = true;
    add("me", `<div class="bub">${esc(text)}${ref ? `<div class="small" style="opacity:.85;margin-top:4px">📖 参考「${esc(ref.target)}」读的 · 匹配 ${ref.score.score}%</div>` : ""}</div>`);
    const dots = add("them", `<div class="bub"><span class="dots"><span></span><span></span><span></span></span></div>`);
    try {
      const fb = await rpc("turn", { scene: o.scene, history: hist, said: text });
      dots.remove();
      hist.push({ r: "u", t: text }); said.push(text);
      turns++; wordsN += words(text).length; cnt();
      (fb.corrections || []).forEach(c => corrections.push(c));
      feedback(fb, text);
      partner(fb.reply, fb.reply_zh, fb.suggest);
    } catch (e) {
      dots.remove();
      const m = String(e.message || e);

      if (/NO_KEY|BAD_KEY/.test(m)) { go("settings", { needKey: m }); return; }
      const d = add("sys", `<div class="bub">😵 ${esc(m)}<div class="btns" style="justify-content:center"><button class="btn ghost" style="min-height:40px">重试</button></div></div>`);
      $("button", d).onclick = () => { d.remove(); msgs.lastElementChild && msgs.lastElementChild.classList.contains("me") && msgs.lastElementChild.remove(); waiting = false; send(text); };
    } finally { waiting = false; $("#mic", box).disabled = false; }
  }
  if (STT.ok()) {
    let liveB = null;
    holdToTalk($("#mic", box), {
      idle: "🎤 按住说话（松开发送）",
      onText: t => { if (!liveB) liveB = add("me live", `<div class="bub"></div>`); $(".bub", liveB).textContent = t; scroll(); },
      onDone: r => {
        if (liveB) { liveB.remove(); liveB = null; }
        const t = (r.text || "").trim();
        if (!t) { toast(r.err === "not-allowed" ? "麦克风没被允许：请允许，或到设置里换输入方式" : "没听清，再说一次" + (r.err ? "（" + (ERRTXT[r.err] || r.err) + "）" : ""), 2500); return; }
        if (/[\u4e00-\u9fff]/.test(t)) { toast("识别到中文，请用英文再说一次", 2500); return; }
        send(t);
      },
    });
  } else {
    $("#mic", box).onclick = async () => { const t = await readAloud(null, lastPartner()); if (t) send(t); };
  }
  $("#type", box).onclick = () => { const tb = $("#tb", box); tb.hidden = !tb.hidden; if (!tb.hidden) $("#ti", box).focus(); };
  $("#ts", box).onclick = () => { const i = $("#ti", box); send(i.value); i.value = ""; };
  $("#ti", box).onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#ts", box).click(); } };
  $("#slow", box).onclick = () => TTS.speak(lastPartner(), { slow: true });
  $("#hint", box).onclick = async () => {
    const d = add("sys", `<div class="bub"><span class="dots"><span></span><span></span><span></span></span></div>`);
    try {
      const st = await rpc("hint", { scene: o.scene, partner: lastPartner() });
      d.innerHTML = `<div class="card" style="text-align:left;margin:0"><div class="muted small" style="margin-bottom:6px">💡 可以这样回答（点句子 → 先听 → 看着读出来）</div>${st.map(x => `<div class="shadow"><button class="ib" data-s>🔊</button><div class="grow" data-send><div class="en" style="font-size:16px">${esc(x.en)}</div><div class="zh">${esc(x.zh)}</div></div></div>`).join("")}<div class="muted small">也可以只看一眼，然后用 🎤 换成自己的话说</div></div>`;
      $$("[data-s]", d).forEach((b, i) => b.onclick = () => TTS.speak(st[i].en));
      $$("[data-send]", d).forEach((b, i) => b.onclick = async () => { const t = st[i].en; await TTS.speak(t); const said = await readAloud(t); if (!said) return; d.remove(); send(said, { target: t, score: shadowScore(t, said) }); });
      scroll();
    } catch (e) { d.innerHTML = `<div class="bub">提示没拿到：${esc(e.message)}</div>`; }
  };
  $("#end", box).onclick = async () => {
    TTS.stop();
    const avgWords = turns ? +(wordsN / turns).toFixed(1) : 0;
    const res = { turns, words: wordsN, avgWords, retries, corrections: corrections.length, summary: "" };
    if (turns) {
      rpc("logSession", { kind: o.kind || "chat", turns, words: wordsN, avgWords, corrections: corrections.length, retries });
      if (corrections.length) rpc("addCards", { items: corrections.map(c => ({ term: c.better, zh: c.why_zh, ex: c.better, note: "你当时说：" + c.you_said })), cat: "我的纠错" }).then(n => n && toast(`${n} 条纠错已加入单词本`));
      try {
        const s = await busy("正在总结这次对话…", () => rpc("summary", { said, corrections }));
        res.summary = `<div class="card"><div class="title" style="margin-bottom:6px">这次对话</div><div>👍 ${esc(s.did_well_zh)}</div>${(s.top_issues || []).map((x, i) => `<div class="corr"><div><b>${i + 1}. ${esc(x.issue_zh)}</b></div><div class="v">${esc(x.example_en)}</div></div>`).join("")}<div style="margin-top:8px">🎯 下次重点：${esc(s.next_focus_zh)}</div>${mode === "brave" && corrections.length ? `<details style="margin-top:10px"><summary>查看全部 ${corrections.length} 条纠错</summary>${corrections.map(c => `<div class="corr"><div class="x">${esc(c.you_said)}</div><div class="v">${esc(c.better)}</div><div class="muted small">${esc(c.why_zh)}</div></div>`).join("")}</details>` : ""}</div>`;
      } catch (e) {}
      await refresh();
    }
    if (o.minTurns && turns < o.minTurns) toast(`这次说了 ${turns} 句，过关需要 ${o.minTurns} 句`, 2600);
    o.onEnd(res);
  };
  partner(o.opener, "", o.openerSuggest);
  cnt();
}

  catch (e) { if (!e.handled) back(); return; }

    } else if (st.step === 1) {
      h += `<div class="card"><div class="row"><div class="title grow">${esc(L.title_en)}</div><button class="chip" id="play">▶︎</button><button class="chip" id="zhb">中文</button></div><div class="passage" style="margin-top:8px">${paras.map(x => `<p>${wordify(highlight(x, terms, "vw"))}</p>`).join("")}</div><div class="zh" id="pzh" hidden>${esc(L.passage_zh)}</div>${(L.reused || []).length ? `<div class="small" style="margin-top:8px">🔁 文中复现了你在学的词：<span class="vr">${esc(L.reused.join("、"))}</span></div>` : ""}<div class="muted small" style="margin-top:6px">黄色是生词；其他不认识的词也可以直接点</div></div>`;

      h += `<div class="card"><div class="title" style="margin-bottom:6px">生词（自动加入单词本）</div>${(L.vocab || []).map(x => `<div class="shadow"><button class="ib" data-v="${esc(x.term)}">🔊</button><div class="grow"><b>${esc(x.term)}</b> · ${esc(x.zh)}<div class="muted small"><i>${esc(x.ex)}</i></div>${whyHtml(x)}</div></div>`).join("") || `<div class="muted">这篇的词你都学过了 👍</div>`}</div><div class="btns"><button class="btn" id="next">下一步：语法 ›</button></div>`;

        h += `</div>`;

    } else if (st.step === 4) {
      h += `<div class="card" style="text-align:center"><div style="font-size:46px">🎉</div><div class="big">今天的新闻课完成</div>${st.chat ? `<div class="grid3" style="margin-top:14px"><div class="stat"><b>${st.chat.turns}</b><span>说了几句</span></div><div class="stat"><b>${st.chat.avgWords}</b><span>平均每句词数</span></div><div class="stat"><b>${Object.keys(st.best).length}</b><span>跟读句数</span></div></div>` : ""}</div>${st.chat && st.chat.summary ? st.chat.summary : ""}<div class="btns"><button class="btn plain" id="map">回到新闻</button><button class="btn" id="src">看原文</button></div>`;

VIEWS.review = async (v, p) => {
  setHeader(p.cat ? p.cat : "单词复习");
  if (!p.queue) {
    if (p.cat) p.queue = S.deck.filter(c => c.cat === p.cat).sort(() => Math.random() - .5).slice(0, 12).map(c => c.id);
    else p.queue = dueCards().concat(newCards(newLeft())).slice(0, p.limit || 40).map(c => c.id);
    p.total = p.queue.length; p.done = 0; p.again = {};
  }
  const card = () => S.deck.find(c => c.id === p.queue[0]);
  const isCorrCard = c => c.cat === "我的纠错" && /^你当时说：/.test(c.note || "");
  // 补充例句：一进复习就把这一轮所有词打包，只调一次 AI（查过的词直接读存档，不再生成）
  if (!p.exAll && S.hasKey) {
    const items = p.queue.map(id => S.deck.find(x => x.id === id)).filter(c => c && !isCorrCard(c)).map(c => ({ id: c.id, term: c.term, zh: c.zh, ex: c.ex }));
    p.exAll = items.length ? rpc("examples", { items }).catch(() => ({})) : Promise.resolve({});
  }
  // 纠错卡的填空题：同样一轮只调一次 AI
  if (!p.czAll && S.hasKey) {
    const items = p.queue.map(id => S.deck.find(x => x.id === id)).filter(c => c && isCorrCard(c)).map(c => ({ id: c.id, said: c.note.replace(/^你当时说：/, ""), better: c.term }));
    p.czAll = items.length ? rpc("cloze", { items }).catch(() => ({})) : Promise.resolve({});
  }
  const prefetch = () => {};
  // 选择题干扰项：优先同一类别，读起来像但意思不同
  const options = c => {
    const pool = S.deck.filter(x => x.id !== c.id && x.zh && x.zh !== c.zh && !isCorrCard(x));
    const same = pool.filter(x => x.cat === c.cat).sort(() => Math.random() - .5), other = pool.filter(x => x.cat !== c.cat).sort(() => Math.random() - .5);
    const picks = []; for (const x of same.concat(other)) { if (picks.length >= 3) break; if (!picks.some(y => y.zh === x.zh)) picks.push(x); }
    return picks.map(x => x.zh).concat([c.zh]).sort(() => Math.random() - .5);
  };
  const exHtml = (en, zh, i) => `<div class="row" style="align-items:flex-start;margin-top:10px;text-align:left"><button class="ib" data-exs="${i}">🔊</button><div class="grow"><div class="en" style="font-size:16px">${wordify(esc(en))}</div>${zh ? `<div class="muted small">${esc(zh)}</div>` : ""}</div></div>`;
  const draw = (state) => {
    const c = card(); prefetch();
    if (!c) {
      v.innerHTML = `<div class="card flash"><div style="font-size:46px">🎉</div><div class="big">完成</div><div class="muted" style="margin-top:8px">这一轮 ${p.done} 个 · +${p.done} 经验</div><div class="btns">${p.then ? `<button class="btn block" id="nx">继续上课 ›</button>` : `<button class="btn block" id="bk">好</button>`}</div></div>`;
      const bk = $("#bk", v); if (bk) bk.onclick = () => { refresh().then(() => back()); };
      const nx = $("#nx", v); if (nx) nx.onclick = async () => { await refresh(); continueLearning(); };
      return;
    }
    let h = `<div class="row" style="margin:12px 2px"><div class="bar grow"><i style="width:${p.total ? Math.round(p.done / p.total * 100) : 0}%"></i></div><span class="muted small">${p.done}/${p.total}</span></div>`;
    // ---- 我的纠错：选择题式填空（只挖说错的那一处，选项里有你当时的说法）
    if (isCorrCard(c)) {
      const said = c.note.replace(/^你当时说：/, "");
      const del = `<button class="chip" id="delc" style="margin-top:12px">🗑 这个纠正不对，删掉</button>`;
      if (!state || !state.cz) {
        v.innerHTML = h + `<div class="card flash"><div class="muted small">${esc(c.cat)}${c.p ? "" : " · 新"}</div><div class="muted" style="margin-top:12px">正在准备题目…</div></div>`;
        Promise.resolve(p.czAll || {}).then(all => {
          if (card() !== c) return;
          const cz = (all || {})[c.id];
          if (cz && cz.options && cz.options.length >= 2) draw({ cz, opts: cz.options.slice().sort(() => Math.random() - .5) });
          else draw({ cz: { fallback: true } });
        });
        return;
      }
      const cz = state.cz;
      if (cz.fallback) {
        // 没有 AI（没填 Key 或出错）：退回"看错句 → 想 → 看答案"
        const flip = state.flip;
        h += `<div class="card flash"><div class="muted small">${esc(c.cat)}</div><div class="muted" style="margin-top:8px">你当时说：</div><div class="term" style="margin-top:6px;font-size:22px;color:var(--bad)">${esc(said)}</div><div class="muted" style="margin-top:14px">怎么说更地道？先想一想，再看答案</div>${flip ? `<div class="mean" style="margin-top:14px">${esc(c.term)}</div><div class="muted small">${esc(c.zh || "")}</div>` : ""}${del}</div>`;
        h += flip ? `<div class="grades" style="grid-template-columns:1fr 1fr"><button class="btn plain" data-q="0">没想到</button><button class="btn" data-q="4">想到了 ›</button></div>` : `<div class="btns"><button class="btn block" id="flip">显示答案</button></div>`;
        v.innerHTML = h;
        if (!flip) $("#flip", v).onclick = () => { state.flip = true; draw(state); };
        bindDel(c); bindGrade(c); return;
      }
      const answered = state.pick != null;
      const ok = answered && state.opts[state.pick].toLowerCase() === cz.answer.toLowerCase();
      const filled = answered ? esc(cz.sentence).replace(/_{2,}/, `<b class="s-good" style="border-bottom:2px solid var(--ok)">${esc(cz.answer)}</b>`) : esc(cz.sentence).replace(/_{2,}/, `<span style="display:inline-block;min-width:70px;border-bottom:2px solid var(--sub)">&nbsp;</span>`);
      h += `<div class="card flash"><div class="muted small">${esc(c.cat)}${c.p ? "" : " · 新"} · 选出正确的说法</div><div class="muted small" style="margin-top:10px">你当时说：<span style="color:var(--bad)">${esc(said)}</span></div><div class="term" style="margin-top:12px;font-size:22px;line-height:1.45">${filled}</div>`;
      h += `<div style="display:grid;gap:8px;margin-top:14px">${state.opts.map((o, i) => { let cls = "opt"; if (answered) { if (o.toLowerCase() === cz.answer.toLowerCase()) cls += " right"; else if (i === state.pick) cls += " wrong"; } return `<button class="${cls}" data-o="${i}" ${answered ? "disabled" : ""}>${esc(o)}${answered && cz.wrong && o.toLowerCase() === cz.wrong.toLowerCase() ? ` <span class="muted small">← 你当时的说法</span>` : ""}</button>`; }).join("")}</div>`;
      if (answered) h += `<div style="margin-top:14px;font-weight:700" class="${ok ? "s-good" : "s-mid"}">${ok ? "✓ 对了" : "正确的是：" + esc(cz.answer)}</div><div class="why" style="margin-top:8px">${esc(cz.explain_zh)}</div>${cz.ok === false ? `<div class="banner" style="margin-top:8px">⚠️ AI 复核时觉得这条纠正可能改了你的原意。如果不对，点下面删掉。</div>` : ""}<div class="muted small" style="margin-top:10px">完整说法：${esc(c.term)}</div><div class="btns" style="justify-content:center"><button class="chip" id="sayt">🔊 听完整的</button></div>`;
      h += `${del}</div>`;
      if (answered) h += ok ? `<div class="grades" style="grid-template-columns:1fr 2fr"><button class="btn plain" data-q="5">太简单</button><button class="btn" data-q="4">下一个 ›</button></div>` : `<div class="btns"><button class="btn block" data-q="0">记住了，下一个 ›</button></div>`;
      v.innerHTML = h;
      if (!answered) $$("[data-o]", v).forEach(b => b.onclick = () => { state.pick = +b.dataset.o; draw(state); });
      else $("#sayt", v).onclick = () => TTS.speak(c.term);
      bindDel(c); bindGrade(c); return;
    }
    // ---- 普通单词：英译中选择题 → 答完看例句
    const answered = state && state.pick != null;
    if (!state || !state.opts) state = { opts: options(c) };
    h += `<div class="card flash"><div class="muted small">${esc(c.cat)}${c.p ? "" : " · 新词"}</div><div class="term" style="margin-top:8px">${esc(c.term)}</div><div><button class="chip" id="say" style="margin-top:10px">🔊 读</button></div>`;
    h += `<div style="display:grid;gap:8px;margin-top:16px">${state.opts.map((o, i) => {
      let cls = "opt"; if (answered) { if (o === c.zh) cls += " right"; else if (i === state.pick) cls += " wrong"; }
      return `<button class="${cls}" data-o="${i}" ${answered ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>`;
    if (answered) {
      const ok = state.opts[state.pick] === c.zh;
      h += `<div style="margin-top:14px;font-weight:700" class="${ok ? "s-good" : "s-mid"}">${ok ? "✓ 对了" : "记一下：" + esc(c.zh)}</div>`;
      h += `<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><div class="muted small" style="text-align:left;margin-top:6px">例句（点词可以单独听）</div>${exHtml(sentenceOf(c.ex || c.term, c.term), "", 0)}<div id="more"><div class="muted small" style="margin-top:10px">${S.hasKey ? "正在准备另一种说法…" : ""}</div></div></div>`;
      h += `<div id="whybox">${c.why ? whyHtml(c) : `<button class="chip" id="why" style="margin-top:10px">💡 为什么这么说？</button>`}</div><div class="btns" style="justify-content:center"><button class="chip" id="sh">🎤 跟读例句</button></div><div id="shres" class="small" style="margin-top:6px"></div>`;
    }
    h += `</div>`;
    if (answered) {
      const ok = state.opts[state.pick] === c.zh;
      h += ok ? `<div class="grades" style="grid-template-columns:1fr 2fr"><button class="btn plain" data-q="5">太简单</button><button class="btn" data-q="4">下一个 ›</button></div>` : `<div class="btns"><button class="btn block" data-q="0">记住了，下一个 ›<small style="display:block;font-size:12px;font-weight:500;opacity:.8">这个词本轮最后会再考一次</small></button></div>`;
    }
    v.innerHTML = h;
    $("#say", v).onclick = () => TTS.speak(c.term);
    if (!answered) {
      TTS.speak(c.term);
      $$("[data-o]", v).forEach(b => b.onclick = () => { state.pick = +b.dataset.o; draw(state); TTS.speak(c.term); });
      return;
    }
    const all = [{ en: c.ex || c.term }];
    $("[data-exs='0']", v).onclick = () => TTS.speak(sentenceOf(c.ex || c.term, c.term));
    Promise.resolve(p.exAll || {}).then(all => (all || {})[c.id]).then(res => {
      const box = $("#more", v); if (!box || card() !== c) return;
      const items = Array.isArray(res) ? res : (res && res.items) || [];
      if (res && res.exZh) { const row = $("[data-exs='0']", v); if (row) row.nextElementSibling.insertAdjacentHTML("beforeend", `<div class="muted small">${esc(res.exZh)}</div>`); }
      box.innerHTML = (items || []).map((x, i) => exHtml(x.en, x.zh, i + 1)).join("") || (S.hasKey ? "" : `<div class="muted small" style="margin-top:8px">填了 API Key 后会自动补充例句</div>`);
      (items || []).forEach((x, i) => { all.push(x); const b = $(`[data-exs='${i + 1}']`, v); if (b) b.onclick = () => TTS.speak(x.en); });
    });
    if ($("#why", v)) $("#why", v).onclick = async () => {
      const b = $("#why", v); b.disabled = true; b.textContent = "💡 查询中…";
      try { c.why = await rpc("explain", { id: c.id, term: c.term, ex: c.ex }); $("#whybox", v).innerHTML = whyHtml(c) || `<div class="muted small">没有特别的来历</div>`; }
      catch (e) { b.disabled = false; b.textContent = "💡 为什么这么说？（重试）"; toast("没查到：" + e.message); }
    };
    $("#sh", v).onclick = async () => { const tx = sentenceOf(c.ex || c.term, c.term); const t = await readAloud(tx); if (!t) return; const r = shadowScore(tx, t); $("#shres", v).innerHTML = `<b class="${scoreClass(r.score)}">${r.score}%</b> · ${esc(t)}${r.missed.length ? `<br>没对上：${esc(r.missed.join(", "))}` : ""}`; };
    bindGrade(c);
  };
  const bindDel = c => { const b = $("#delc", v); if (b) b.onclick = async () => {
    if (!(await ask("删掉这张纠错卡？", "删掉后不会再出现在复习里。"))) return;
    await rpc("deleteCard", { id: c.id }); S.deck = S.deck.filter(x => x.id !== c.id);
    p.queue = p.queue.filter(id => id !== c.id); p.total = Math.max(p.done, p.total - 1); toast("已删除"); draw(null);
  }; };
  const bindGrade = c => $$("[data-q]", v).forEach(b => b.onclick = async () => {
    const q = +b.dataset.q;
    c.p = await rpc("grade", { id: c.id, q });
    p.queue.shift(); p.done++;
    if (q === 0 && !p.again[c.id]) { p.again[c.id] = 1; p.queue.push(c.id); p.total++; }
    draw(null);
  });
  draw(null);
};

  let hb = 0; const beat = setInterval(() => {

  }, 1000);
})();

function sentenceOf(text, word) {
  const t = String(text || "").replace(/\s+/g, " ").trim();
  if (t.split(" ").length <= 30) return t;
  const parts = t.match(/[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g) || [t];
  const w = String(word || "").toLowerCase().replace(/[^a-z0-9' -]/g, "").trim();
  const hit = w && parts.find(s => s.toLowerCase().includes(w)) || parts[0];
  const ws = hit.trim().split(" ");
  return ws.length > 30 ? ws.slice(0, 30).join(" ") + "…" : hit.trim();
}

    if (byId[card.id]) continue;
    custom.push(card); DECK.push(card); byId[card.id] = card; existing.add(n); added++;
  }
  if (added) writeJSON(P("custom.json"), custom);
  return added;
}

// 简化 SM-2；q: 0 忘了 / 3 模糊 / 4 记得 / 5 简单
function grade(id, q) {
  const wasNew = !progress[id];
  const p = progress[id] || { ef: 2.5, iv: 0, reps: 0, lapses: 0 };
  const t = Date.now();
  if (q < 3) { p.reps = 0; p.iv = 0; p.lapses += 1; p.due = t + 10 * 60000; }
  else {
    p.reps += 1;
    if (p.reps === 1) p.iv = q === 5 ? 3 : 1;
    else if (p.reps === 2) p.iv = q === 3 ? 3 : 6;
    else p.iv = Math.max(1, Math.round(p.iv * p.ef * (q === 3 ? 0.8 : 1) * (q === 5 ? 1.3 : 1)));
    p.ef = Math.max(1.3, p.ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    p.due = t + p.iv * DAY;
  }
  p.last = t;
  progress[id] = p;
  if (wasNew) progress.__meta.newToday += 1;
  progress.__meta.reviewedToday += 1;
  saveProgress();
  markActive("cards"); markActive("xp", 1);
  return p;
}

// 活跃天数（连续打卡）
const activity = await readJSON(P("activity.json"), { days: {} });
function markActive(kind, n = 1) {
  const k = dayKey();
  activity.days[k] = activity.days[k] || {};
  activity.days[k][kind] = (activity.days[k][kind] || 0) + n;
  writeJSON(P("activity.json"), activity);
}
function addXP(n) { markActive("xp", n | 0); return xpToday(); }
function xpToday() { const d = activity.days[dayKey()]; return (d && d.xp) || 0; }
function streak() {
  let s = 0, t = Date.now();
  if (!activity.days[dayKey(t)]) t -= DAY; // 今天还没练，从昨天算
  while (activity.days[dayKey(t)]) { s++; t -= DAY; }
  return s;
}

// 词卡上下文：已有词（不再当生词）+ 在学/常忘的词（尽量复现）
function vocabContext() {
  const soon = Date.now() + 3 * DAY;
  const weak = Object.entries(progress)
    .filter(([id, p]) => id !== "__meta" && byId[id] && p && (p.lapses > 0 || p.due <= soon))
    .sort((a, b) => (b[1].lapses - a[1].lapses) || (a[1].due - b[1].due))
    .slice(0, 8).map(([id]) => byId[id].term).filter(t => t.length <= 40);
  const known = DECK.map(c => c.term).filter(t => t.length <= 40).slice(-400);
  return { weak, known, existing: new Set(DECK.map(c => normTerm(c.term))) };
}

const API = "https://generativelanguage.googleapis.com/v1beta";
function getKey() {
  const k = Keychain.contains("gemini_api_key") ? Keychain.get("gemini_api_key") : "";
  if (!k) throw new Error("NO_KEY");
  return k;
}
const versionOf = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };

async function pickModels(key) {
  const cached = Keychain.contains("gemini_model") ? JSON.parse(Keychain.get("gemini_model")) : null;
  if (cached && cached.chain && Date.now() - cached.t < 7 * DAY) return cached;
  const r = new Request(`${API}/models?pageSize=200`);
  r.headers = { "x-goog-api-key": key };
  let j;
  try { j = await r.loadJSON(); } catch (e) { throw new Error("连不上 Google（国内需要开代理）"); }
  if (!j.models) {
    const m = (j.error && j.error.message) || "";
    if (/key/i.test(m)) throw new Error("BAD_KEY");
    throw new Error("读取模型列表失败：" + m.slice(0, 160));
  }
  const usable = j.models
    .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => m.name.replace("models/", ""))
    .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/(image|tts|live|audio|embedding|thinking|exp|omni|computer)/.test(n));
  const byVer = (a, b) => versionOf(b) - versionOf(a);
  const stable = usable.filter(n => !/lite|preview/.test(n)).sort(byVer);
  const preview = usable.filter(n => !/lite/.test(n) && /preview/.test(n)).sort(byVer);
  const lite = usable.filter(n => /lite/.test(n)).sort((a, b) => (/preview/.test(a) - /preview/.test(b)) || byVer(a, b));
  let chain = [...stable.slice(0, 2), ...preview.slice(0, 1), ...lite.slice(0, 2)];
  if (!chain.length) chain = ["gemini-2.5-flash", "gemini-2.5-flash-lite"];
  const res = { chain: [...new Set(chain)], t: Date.now() };
  Keychain.set("gemini_model", JSON.stringify(res));
  return res;
}
const wait = ms => new Promise(res => Timer.schedule(ms, false, res));

async function gemini(system, userText, schema, temperature = 0.7, contents, opts) {
  const key = getKey();
  const models = await pickModels(key);
  const last = Keychain.contains("gemini_last_ok") ? Keychain.get("gemini_last_ok") : "";
  let chain = last && models.chain.includes(last) ? [last, ...models.chain.filter(m => m !== last)] : models.chain;
  if (opts && opts.lite) chain = chain.filter(m => /lite/.test(m)).concat(chain.filter(m => !/lite/.test(m)));
  const body = JSON.stringify({
    systemInstruction: { parts: [{ text: system }] },
    contents: contents || [{ role: "user", parts: [{ text: userText }] }],
    generationConfig: { temperature, responseMimeType: "application/json", responseSchema: schema },
  });
  let lastErr = "", busy = 0;
  for (const model of chain) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const r = new Request(`${API}/models/${model}:generateContent`);
      r.method = "POST"; r.timeoutInterval = 90; r.body = body;
      r.headers = { "Content-Type": "application/json", "x-goog-api-key": key };
      let j;
      try { j = await r.loadJSON(); } catch (e) { lastErr = "网络错误（国内需要开代理）"; break; }
      if (j && j.error) {
        const code = j.error.code || (r.response && r.response.statusCode);
        lastErr = `${code} ${j.error.message || ""}`;
        if ([429, 500, 503].includes(code)) { busy++; if (attempt === 0) { await wait(code === 429 ? 4000 : 2500); continue; } break; }
        if (code === 404) { if (Keychain.contains("gemini_model")) Keychain.remove("gemini_model"); break; }
        if ([400, 401, 403].includes(code) && /key/i.test(j.error.message || "")) throw new Error("BAD_KEY");
        throw new Error(lastErr);
      }
      const text = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts
        ? j.candidates[0].content.parts.map(p => p.text || "").join("") : "";
      let out = null;
      try { out = JSON.parse(text); } catch (e) { const m = text.match(/\{[\s\S]*\}/); if (m) { try { out = JSON.parse(m[0]); } catch (e2) {} } }
      if (out) { Keychain.set("gemini_last_ok", model); return out; }
      lastErr = "模型返回格式异常"; break;
    }
  }
  if (busy) throw new Error(`Google 的模型现在太忙，已自动重试并换了 ${chain.length} 个模型。等 1–2 分钟再试，一般就好了。`);
  throw new Error(lastErr || "调用失败");
}

// 纠错卡 → 选择题式填空：只挖你说错的那一处，选项里放上你当时的说法。一轮复习打包生成一次，存起来
const clozeCache = await readJSON(P("cloze.json"), {});
async function clozeBatch({ items }) {
  const out = {}, need = [];
  for (const it of items || []) { if (clozeCache[it.id]) out[it.id] = clozeCache[it.id]; else need.push(it); }
  for (let i = 0; i < need.length; i += 15) {
    const chunk = need.slice(i, i + 15);
    const r = await gemini("You turn a learner's spoken mistake into ONE multiple-choice cloze question about exactly the part he got wrong. Be accurate; never change the intended meaning.",
      `For EACH item: "said" is what the learner said, "better" is the corrected version.\n- sentence = the corrected sentence with the key corrected part replaced by "____" (blank only the 1-4 words that he got wrong; if several separate fixes, blank the most important one).\n- answer = the exact words that fill the blank (from "better").\n- wrong = what he said in that spot (his version of that part, from "said"; may be empty if he left it out).\n- options = exactly 4 short options: answer, his wrong version (or a typical Chinese-speaker mistake if empty), and 2 other plausible but wrong forms. No duplicates.\n- explain_zh = one or two short Simplified Chinese sentences: why the answer is right and what was wrong with his version.\n- ok = false if "better" changes his meaning or is itself wrong; else true.\nItems:\n` + chunk.map((x, j) => `${j + 1}. said: ${x.said} | better: ${x.better}`).join("\n"),
      S.obj({ items: S.arr(S.obj({ n: S.int, sentence: S.str, answer: S.str, wrong: S.str, options: S.arr(S.str), explain_zh: S.str, ok: S.bool })) }), 0.3, null, { lite: true });
    (r.items || []).forEach(x => {
      const it = chunk[(x.n | 0) - 1]; if (!it || !x.sentence || !/_{2,}/.test(x.sentence) || !x.answer) return;
      let opts = Array.from(new Set((x.options || []).map(o => String(o).trim()).filter(Boolean)));
      if (!opts.some(o => o.toLowerCase() === x.answer.trim().toLowerCase())) opts.unshift(x.answer.trim());
      opts = opts.slice(0, 4);
      const v = { sentence: x.sentence, answer: x.answer.trim(), wrong: x.wrong || "", options: opts, explain_zh: x.explain_zh || "", ok: x.ok !== false };
      clozeCache[it.id] = v; out[it.id] = v;
    });
    writeJSON(P("cloze.json"), clozeCache);
  }
  return out;
}

// ---------------- AI 语音（Gemini TTS），生成 wav 存本地 ----------------
async function pickTTS(key) {
  const cached = Keychain.contains("gemini_tts") ? JSON.parse(Keychain.get("gemini_tts")) : null;
  if (cached && cached.chain && Date.now() - cached.t < 7 * DAY) return cached.chain;
  const r = new Request(`${API}/models?pageSize=200`);
  r.headers = { "x-goog-api-key": key };
  let j; try { j = await r.loadJSON(); } catch (e) { throw new Error("连不上 Google（国内需要开代理）"); }
  const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", "")).filter(n => /tts/.test(n) && !/pro/.test(n));
  const rank = n => versionOf(n) * 10 - (/preview/.test(n) ? 3 : 0) - (/lite/.test(n) ? 1 : 0);
  let chain = names.sort((a, b) => rank(b) - rank(a)).slice(0, 4);
  if (!chain.length) chain = ["gemini-2.5-flash-preview-tts"];
  Keychain.set("gemini_tts", JSON.stringify({ chain, t: Date.now() }));
  return chain;
}
// 54 字节的 WAV 头（多一个 2 字节 JUNK 块，让长度是 3 的倍数，base64 可以直接拼接）
function b64(bytes) {
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"; let o = "";
  for (let i = 0; i < bytes.length; i += 3) { const n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2]; o += A[(n >> 18) & 63] + A[(n >> 12) & 63] + A[(n >> 6) & 63] + A[n & 63]; }
  return o;
}
function wavHeaderB64(dataLen, rate) {
  const b = []; const s4 = t => { for (const c of t) b.push(c.charCodeAt(0)); };
  const u32 = v => b.push(v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255);
  const u16 = v => b.push(v & 255, (v >> 8) & 255);
  s4("RIFF"); u32(46 + dataLen); s4("WAVE");
  s4("fmt "); u32(16); u16(1); u16(1); u32(rate); u32(rate * 2); u16(2); u16(16);
  s4("JUNK"); u32(2); u16(0);
  s4("data"); u32(dataLen);
  return b64(b);
}
const audioMem = {};
const audioPath = id => fm.joinPath(AUDIO_DIR, id + ".wav");
const VOICES = { Kore: "女声·清晰", Aoede: "女声·轻松", Puck: "男声·轻快", Charon: "男声·沉稳" };
async function ttsAudio({ text, dialogue, a, b, voice }) {
  text = (text || "").trim();
  const v = voice || settings.aiVoice || "Kore";
  const id = hashId((dialogue ? "D|" + a + "|" + b + "|" : "S|" + v + "|") + text);
  const path = audioPath(id);
  if (!audioMem[id] && fm.fileExists(path)) {
    if (fm.isFileStoredIniCloud && fm.isFileStoredIniCloud(path) && !fm.isFileDownloaded(path)) await fm.downloadFileFromiCloud(path);
    audioMem[id] = fm.read(path).toBase64String();
  }
  if (!audioMem[id]) {
    const key = getKey();
    const chain = await pickTTS(key);
    const speechConfig = dialogue
      ? { multiSpeakerVoiceConfig: { speakerVoiceConfigs: [
          { speaker: "A", voiceConfig: { prebuiltVoiceConfig: { voiceName: a || "Kore" } } },
          { speaker: "B", voiceConfig: { prebuiltVoiceConfig: { voiceName: b || "Puck" } } }] } }
      : { voiceConfig: { prebuiltVoiceConfig: { voiceName: v } } };
    const prompt = dialogue
      ? `Read this conversation between A and B aloud. Natural, friendly voices with ${region().accent}, clear pronunciation, relaxed everyday pace:\n\n${text}`
      : `Read aloud in ${region().accent}, with clear pronunciation and a relaxed, steady pace:\n\n${text}`;
    let lastErr = "", pcm = null, rate = 24000;
    for (const model of chain) {
      for (let attempt = 0; attempt < 2 && !pcm; attempt++) {
        const r = new Request(`${API}/models/${model}:generateContent`);
        r.method = "POST"; r.timeoutInterval = 120;
        r.headers = { "Content-Type": "application/json", "x-goog-api-key": key };
        r.body = JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig } });
        let j; try { j = await r.loadJSON(); } catch (e) { lastErr = "网络错误（国内需要开代理）"; break; }
        if (j && j.error) {
          lastErr = `${j.error.code} ${j.error.message || ""}`;
          if ([429, 500, 503].includes(j.error.code) && attempt === 0) { await wait(3000); continue; }
          if (j.error.code === 404 && Keychain.contains("gemini_tts")) Keychain.remove("gemini_tts");
          break;
        }
        const part = j && j.candidates && j.candidates[0] && j.candidates[0].content && (j.candidates[0].content.parts || []).find(p => p.inlineData);
        if (!part) { lastErr = "没有返回音频"; break; }
        pcm = part.inlineData.data;
        const m = (part.inlineData.mimeType || "").match(/rate=(\d+)/); if (m) rate = +m[1];
      }
      if (pcm) break;
    }
    if (!pcm) throw new Error("AI 语音暂时生成不了：" + lastErr.slice(0, 120));
    const pad = (pcm.match(/=*$/) || [""])[0].length;
    const len = pcm.length * 3 / 4 - pad;
    audioMem[id] = wavHeaderB64(len, rate) + pcm;
    fm.write(path, Data.fromBase64String(audioMem[id]));
  }
  const CH = 800000;
  return { id, parts: Math.ceil(audioMem[id].length / CH) };
}
function audioPart({ id, i }) { const CH = 800000; return (audioMem[id] || "").slice(i * CH, (i + 1) * CH); }
