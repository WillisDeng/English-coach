function decodeEntities(s) {
  return (s || "").replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
    .replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d)).replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&nbsp;/g, " ");
}
const stripTags = s => decodeEntities(s).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
function parseRSS(xml) {
  const items = []; const re = /<item[\s>][\s\S]*?<\/item>/g; let m;
  while ((m = re.exec(xml)) && items.length < 15) {
    const b = m[0];
    const get = tag => { const x = b.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`)); return x ? stripTags(x[1]) : ""; };
    const title = get("title"); if (!title) continue;
    items.push({ title, link: get("link"), desc: get("description").slice(0, 300) });
  }
  return items;
}
async function fetchFeed(url) {
  try { const r = new Request(url); r.timeoutInterval = 25; return parseRSS(await r.loadString()); } catch (e) { return []; }
}
async function fetchArticle(url) {
  try {
    const r = new Request(url); r.timeoutInterval = 25;
    const html = await r.loadString();
    const paras = []; const re = /<p[^>]*>([\s\S]*?)<\/p>/g; let m;
    while ((m = re.exec(html))) { const t = stripTags(m[1]); if (t.length > 60 && !/cookie|subscribe|newsletter|copyright|©|sign up|download the app/i.test(t)) paras.push(t); }
    return paras.join("\n").slice(0, 3500);
  } catch (e) { return ""; }
}
const NEWS_SCHEMA = S.obj({
  title_en: S.str, title_zh: S.str, passage: S.str, passage_zh: S.str,
  vocab: S.arr(S.obj({ term: S.str, zh: S.str, ex: S.str, why_zh: S.str })),

async function getNews({ cat, force }) {
  const date = dayKey();
  const path = newsPath(date, cat);
  const old = await readJSON(path, null);
  if (old && !force) return old;
  const usedTitles = old ? (old.usedTitles || [old.src_title]) : [];
  const catDef = NEWS_CATS.find(c => c.key === cat);
  if (!catDef) throw new Error("没有这个分类");

  // 拉新闻列表
  let items = [];
  if (cat === "pick") {
    const keys = ["world", "business", "tech", "sport", "ent", "science", "health"];
    const lists = await Promise.all(keys.map(k => fetchFeed(NEWS_CATS.find(c => c.key === k).feeds[0])));
    lists.forEach((l, i) => l.slice(0, 4).forEach(x => items.push(Object.assign({ cat: keys[i] }, x))));
  } else {
    for (const f of catDef.feeds) { items = await fetchFeed(f); if (items.length) break; }
  }
  items = items.filter(x => !usedTitles.includes(x.title));
  if (!items.length) throw new Error("新闻源读取失败（国内需要开代理），换个分类试试");

  let idx = 0;
  const bad = /(dies|died|death|dead|killed|murder|stabb|shooting|fatal|rape|abuse|suicide)/i;
  try {
    const pick = await gemini(
      "Pick the ONE news item that is most engaging and talk-worthy for an adult English learner: interesting, surprising, useful or fun to discuss. Avoid deaths, violent crime, abuse and tragedies. Return its 0-based index.",
      items.map((x, k) => `${k}. ${x.title} — ${x.desc}`).join("\n"), S.obj({ index: S.int }), 0.3);
    idx = Math.max(0, Math.min(items.length - 1, pick.index | 0));
  } catch (e) { idx = Math.max(0, items.findIndex(x => !bad.test(x.title))); }
  const it = items[idx];
  const body = await fetchArticle(it.link);
  const vc = vocabContext();
  const L = await gemini(
    `You create a daily English lesson for ${learnerFor("adult")}. Target level B1-B2. Use ${region().english}.`,
    `From this news material:
- title_en / title_zh: a short catchy title (your own words) and Chinese.
- passage: retell the story IN YOUR OWN WORDS as a 160-220 word learner-friendly news piece (clear sentences, key facts, no copied sentences). Use ONLY facts stated in the material below: do not add names, titles, numbers, quotes or background that are not there. If the article text is not available, write a shorter 110-150 word piece that stays with what the headline and summary say.
- passage_zh: Chinese translation.
- vocab: 6-8 useful words/phrases from your passage that an adult would actually use, NOT in KNOWN WORDS. zh = Chinese, ex = a NEW everyday example sentence, why_zh = if the term is an abbreviation, slang, idiom, phrasal verb, brand name used as a common noun, or its real meaning differs from the literal words, explain in 1-2 short Simplified Chinese sentences what it stands for / where it comes from / how locals use it (mention other countries' equivalents if useful); otherwise empty string.
- grammar: 1-2 grammar points from your passage that Chinese speakers often get wrong. explain_zh short; example_en from the passage; practice: 2 Chinese sentences to translate with model answers.
- shadow: 4 sentences copied from YOUR passage, good for reading aloud.
- questions: 3 open discussion questions, easy to answer by speaking, at least one about his own life.
- reused: which REVIEW WORDS you used in the passage.
- gloss: 20-30 other words in your passage that a Chinese B1 learner may not know (not the vocab items). w = the word exactly as written, zh = its meaning in this context, max 8 Chinese characters.
REVIEW WORDS (he is learning these; weave 2-4 in naturally if they fit): ${vc.weak.join("; ") || "(none)"}
KNOWN WORDS: ${vc.known.join("; ") || "(none)"}

Headline: ${it.title}
Summary: ${it.desc}
Article:
${body || "(not available, use headline and summary)"}`,
    NEWS_SCHEMA, 0.5);
  L.vocab = (L.vocab || []).filter(v => !vc.existing.has(normTerm(v.term)));
  const weakSet = new Set(vc.weak.map(normTerm));
  L.reused = (L.reused || []).filter(t => weakSet.has(normTerm(t)) && normTerm(L.passage).includes(normTerm(t)));
  Object.assign(L, { cat, date, src_title: it.title, url: it.link, srcCat: it.cat || cat, usedTitles: usedTitles.concat([it.title]), done: {} });
  writeJSON(path, L);
  return L;
}

// ---------------- 网页桥接 ----------------
async function runApp(route) {
  const wv = new WebView();
  let pumping = false, again = false;
  async function handle(call) {
    let resp;
    try {
      const fn = RPC[call.method];
      if (!fn) throw new Error("未知操作：" + call.method);
      resp = { ok: true, result: await fn(call.params || {}) };
    } catch (e) { resp = { ok: false, error: String((e && e.message) || e) }; }
    if (resp.result === undefined) resp.result = null;
    try { await wv.evaluateJavaScript(`window.__resolve(${JSON.stringify(call.id)}, ${JSON.stringify(resp)})`); } catch (e) {}
  }
  async function pump() {
    if (pumping) { again = true; return; }
    pumping = true;
    try {
      do {
        again = false;
        const raw = await wv.evaluateJavaScript("JSON.stringify(window.__takeRpc ? window.__takeRpc() : [])");
        let list = [];
        try { list = JSON.parse(raw || "[]"); } catch (e) {}
        for (const c of list) handle(c); // 并发处理，不阻塞
      } while (again);
    } catch (e) {} finally { pumping = false; }
  }
  wv.shouldAllowRequest = req => {
    const u = (req && req.url) || "";
    if (u.indexOf("app://") === 0) { pump(); return false; }
    if (u.indexOf("https://localhost") === 0) return true;   // 页面自己的地址（安全环境，才能用麦克风和语音识别）
    if (/^https?:/.test(u)) { Safari.open(u); return false; }
    return true;
  };
  const boot = { route: route || null };
  stage(`存储：${STORE}`);
  stage("开始加载页面（" + Math.round(PAGE_HTML.length / 1024) + " KB）");
  const html = PAGE_HTML.replace("/*__BOOT__*/", "window.__BOOT=" + JSON.stringify(boot) + ";");
  // 3.8：启动流程回到和测试脚本、以及 3.3（能进去的版本）完全一样的写法：
  //   先 await 加载完页面，再 await 显示窗口；启动时不开任何定时器（3.4 起加的看门狗/定时取请求，和黑屏同时出现）。
  //   页面发请求仍用 app:// 信号，但只在页面"加载完成"之后才发（3.3 卡住的原因是加载过程中就发了）。
  const t1 = Date.now();
  await wv.loadHTML(html, "https://localhost/");
  stage(`页面加载完成（${((Date.now() - t1) / 1000).toFixed(1)} 秒）`);
  await wv.present(true);
}

function buildWidget() {

  const due = DECK.filter(c => progress[c.id] && progress[c.id].due <= now).sort((a, b) => progress[a.id].due - progress[b.id].due);
  let card, label;
  if (due.length) { card = due[0]; label = `待复习 ${due.length}`; }
  else {
    const fresh = DECK.filter(c => !progress[c.id]);
    const pool = fresh.length ? fresh : DECK;
    card = fresh.length ? fresh[0] : pool[Math.floor(Math.random() * pool.length)];
    label = fresh.length ? "新词" : "回顾";
  }
  const w = new ListWidget();
  w.url = `scriptable:///run/${encodeURIComponent(Script.name())}?view=review`;
  w.refreshAfterDate = new Date(now + 30 * 60000);
  if (fam === "accessoryInline") { w.addText(`${card.term} · ${card.zh}`); return w; }
  if (fam.indexOf("accessory") === 0) {
    const t = w.addText(card.term); t.font = Font.boldSystemFont(14); t.minimumScaleFactor = 0.6;
    const z = w.addText(card.zh); z.font = Font.systemFont(11); z.lineLimit = 2;
    return w;
  }
  const bg = new LinearGradient(); bg.colors = [new Color("#0f2747"), new Color("#1d4e89")]; bg.locations = [0, 1];
  w.backgroundGradient = bg; w.setPadding(12, 14, 12, 14);
  const h = w.addText(`${card.cat} · ${label} · 🔥${streak()}`); h.font = Font.mediumSystemFont(10); h.textColor = new Color("#9fc3ee");
  w.addSpacer(4);
  const t = w.addText(card.term); t.font = Font.boldSystemFont(fam === "small" ? 17 : 20); t.textColor = Color.white(); t.minimumScaleFactor = 0.5; t.lineLimit = 2;
  w.addSpacer(3);
  const z = w.addText(card.zh); z.font = Font.systemFont(12); z.textColor = new Color("#dbe8f7"); z.lineLimit = fam === "small" ? 3 : 2;
  if (fam !== "small") { w.addSpacer(6); const e = w.addText(card.ex); e.font = Font.italicSystemFont(12); e.textColor = new Color("#bcd3ee"); e.lineLimit = fam === "large" ? 4 : 2; }
  w.addSpacer();
  return w;
}
