name: 抓新闻
on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小时一次（UTC）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/fetch_feeds.py", ".github/workflows/feeds.yml"]
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 抓取 RSS 和正文
        run: python3 tools/fetch_feeds.py feeds.json
      - name: 提交
        run: |
          git config user.name "feeds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet && exit 0
          git commit -m "更新新闻 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
